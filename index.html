<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Semáforo Docente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: una sola pantalla — carcasa vertical del semáforo al centro, tarjeta de color a pantalla completa al tocar */
:root {
  color-scheme: dark;
  --bg: #0d1013;
  --housing: #1b2026;
  --housing-edge: #2a313a;
  --fg: #eef1f4;
  --muted: #8b96a3;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
  --green-off: #0f2a1a;
  --amber-off: #2e2110;
  --red-off: #2e1213;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  gap: 20px; padding-block: 20px 24px;
  max-width: 460px; margin: 0 auto;
}
header { text-align: center; display: grid; gap: 6px; justify-items: center; }
.logo { width: clamp(88px, 26vw, 120px); height: auto; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
.credits { margin-top: auto; padding-top: 8px; color: var(--muted); font-size: .85rem; text-align: center; }
.credits strong { color: var(--fg); font-weight: 600; }
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(1.6rem, 7vw, 2.2rem); margin: 0; letter-spacing: .02em;
  text-wrap: balance;
}
.sub { color: var(--muted); margin: 0; font-size: .95rem; }

.pole { display: flex; flex-direction: column; align-items: center; }
.housing {
  background: var(--housing);
  border: 3px solid var(--housing-edge);
  border-radius: 40px;
  padding: 18px;
  display: grid; gap: 16px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.04);
  position: relative;
}
.stick { width: 26px; height: 40px; background: var(--housing-edge); border-radius: 0 0 6px 6px; }

.lamp {
  --c: var(--green); --off: var(--green-off);
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px;
  background: transparent; border: 0; color: var(--fg); cursor: pointer;
  text-align: left; padding: 6px 14px 6px 6px; border-radius: 999px;
  font: inherit;
  transition: background .2s;
}
.lamp:hover { background: rgba(255,255,255,.03); }
.lamp:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.lamp[data-c="amarillo"] { --c: var(--amber); --off: var(--amber-off); }
.lamp[data-c="rojo"] { --c: var(--red); --off: var(--red-off); }

.bulb {
  width: clamp(84px, 24vw, 110px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 35%, var(--off)) 0%, var(--off) 60%);
  box-shadow: inset 0 6px 14px rgba(0,0,0,.6);
  position: relative;
  transition: background .25s, box-shadow .25s, transform .15s;
}
.bulb::before { /* visera */
  content: ""; position: absolute; inset: -8px -8px auto; height: 50%;
  border-radius: 999px 999px 0 0; border-top: 6px solid #12161a;
}
.lamp:active .bulb { transform: scale(.96); }
.lamp.on .bulb {
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--c) 35%, color-mix(in srgb, var(--c) 70%, #000) 100%);
  box-shadow: 0 0 30px var(--c), 0 0 70px color-mix(in srgb, var(--c) 60%, transparent), inset 0 -6px 14px rgba(0,0,0,.25);
}
.label { display: grid; gap: 2px; min-width: 0; }
.label b {
  font-family: var(--font-display); font-weight: 400; font-size: 1.15rem;
  color: var(--c); letter-spacing: .04em;
}
.label span { color: var(--muted); font-size: .9rem; line-height: 1.3; }
.lamp.dim { opacity: .45; }

.hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }

/* Tarjeta a pantalla completa */
.flash {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: var(--c); color: #0d1013;
  --c: var(--green);
  animation: pop .25s ease-out;
}
.flash[data-c="amarillo"] { --c: var(--amber); }
.flash[data-c="rojo"] { --c: var(--red); color: #fff; }
.flash .word {
  font-family: var(--font-display); font-size: clamp(3rem, 16vw, 7rem); line-height: 1;
  margin: 0; letter-spacing: .02em;
}
.flash .meaning { font-size: clamp(1.1rem, 4.5vw, 1.6rem); font-weight: 600; margin: 0; max-width: 22ch; text-wrap: balance; }
.flash .big-dot {
  width: clamp(120px, 40vw, 220px); aspect-ratio: 1; border-radius: 50%; max-width: 100%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 45%, rgba(0,0,0,.15) 100%);
  box-shadow: 0 0 0 10px rgba(0,0,0,.12);
}
.flash button {
  font: 800 1rem var(--font-body); border: 0; cursor: pointer;
  background: rgba(0,0,0,.82); color: #fff; padding: 14px 26px; border-radius: 999px;
  margin-top: 8px;
}
.flash button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; }
  .bulb, .lamp { transition: none; }
}
</style>

    <h1>SEMÁFORO TECNOLÓGICO</h1>
    <p class="sub">Escucha la situación y toca el color que elijas.</p>
  </header>

  <div class="pole">
    <div class="housing" role="group" aria-label="Semáforo">
      <button class="lamp" id="l-rojo" data-c="rojo" aria-pressed="false">
        <span class="bulb" aria-hidden="true"></span>
        <span class="label"><b>ROJO</b><span>Riesgo, conducta inadecuada o peligro.</span></span>
      </button>
      <button class="lamp" id="l-amarillo" data-c="amarillo" aria-pressed="false">
        <span class="bulb" aria-hidden="true"></span>
        <span class="label"><b>AMARILLO</b><span>Precaución, reflexión o verificación.</span></span>
      </button>
      <button class="lamp" id="l-verde" data-c="verde" aria-pressed="false">
        <span class="bulb" aria-hidden="true"></span>
        <span class="label"><b>VERDE</b><span>Uso adecuado y responsable.</span></span>
      </button>
    </div>
    <div class="stick" aria-hidden="true"></div>
  </div>

  <p class="hint">Al tocar, tu pantalla se llena del color. Levanta tu dispositivo para mostrarlo.</p>

</div>

<div class="flash" id="flash" hidden role="dialog" aria-modal="true" aria-labelledby="f-word">
  <div class="big-dot" aria-hidden="true"></div>
  <p class="word" id="f-word">VERDE</p>
  <p class="meaning" id="f-meaning"></p>
  <button id="f-close">Siguiente pregunta</button>
</div>

<script>
const INFO = {
  verde:    { word: "VERDE",    meaning: "Uso adecuado y responsable." },
  amarillo: { word: "AMARILLO", meaning: "Precaución, reflexión o verificación." },
  rojo:     { word: "ROJO",     meaning: "Riesgo, conducta inadecuada o peligro." }
};
const lamps = [...document.querySelectorAll(".lamp")];
const flash = document.getElementById("flash");
const fWord = document.getElementById("f-word");
const fMeaning = document.getElementById("f-meaning");
const fClose = document.getElementById("f-close");
let wakeLock = null;

async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch (e) {}
}

function choose(c) {
  lamps.forEach(l => {
    const on = l.dataset.c === c;
    l.classList.toggle("on", on);
    l.classList.toggle("dim", !on);
    l.setAttribute("aria-pressed", on ? "true" : "false");
  });
  flash.dataset.c = c;
  fWord.textContent = INFO[c].word;
  fMeaning.textContent = INFO[c].meaning;
  flash.hidden = false;
  fClose.focus();
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  keepAwake();
}

function reset() {
  flash.hidden = true;
  lamps.forEach(l => { l.classList.remove("on", "dim"); l.setAttribute("aria-pressed", "false"); });
}

lamps.forEach(l => l.addEventListener("click", () => choose(l.dataset.c)));
fClose.addEventListener("click", reset);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !flash.hidden) reset(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !flash.hidden) keepAwake(); });
</script>
